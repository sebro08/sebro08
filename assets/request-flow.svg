<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="A request travels from Angular to the API, the cache, the databases and the analytics layer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A request traveling through my stack</title>
  <style>
    .t   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #24292f; }
    .sub { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
    .node { fill: rgba(108,140,255,0.10); stroke: #6c8cff; stroke-width: 1.5; }
    .wire { fill: none; stroke: #6c8cff; stroke-width: 1.6; stroke-opacity: .55; stroke-dasharray: 5 7; animation: flow 1.4s linear infinite; }
    .box  { fill: none; stroke: #8b949e; stroke-width: 1.2; stroke-dasharray: 3 6; stroke-opacity: .7; }
    .dot  { fill: #ff7a59; }
    .halo { fill: #ff7a59; opacity: .25; }
    .pulse{ fill: none; stroke: #ff7a59; stroke-width: 2; opacity: 0; animation: arrive 4.8s ease-out infinite; }
    .req  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ff7a59; font-size: 12px; font-weight: 600; opacity: 0; }
    .r1 { animation: show 14.4s infinite 0s; }
    .r2 { animation: show 14.4s infinite 4.8s; }
    .r3 { animation: show 14.4s infinite 9.6s; }
    @keyframes flow   { to { stroke-dashoffset: -24; } }
    @keyframes show   { 0% {opacity:0} 2% {opacity:1} 30% {opacity:1} 33% {opacity:0} 100% {opacity:0} }
    @keyframes arrive { 0% {opacity:0} 3% {opacity:.95} 20% {opacity:0} 100% {opacity:0} }
    @media (prefers-color-scheme: dark) {
      .t   { fill: #e6edf3; }
      .sub { fill: #8b949e; }
      .node{ fill: rgba(108,140,255,0.14); stroke: #8da6ff; }
      .wire{ stroke: #8da6ff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wire, .pulse, .r1, .r2, .r3 { animation: none; }
      .dot, .halo { display: none; }
      .r1 { opacity: 1; }
    }
  </style>

  <!-- Contenedor -->
  <rect class="box" x="215" y="20" width="430" height="236" rx="16"/>
  <text class="sub" x="231" y="40" font-size="11">docker compose · kubernetes</text>

  <!-- Cables -->
  <path id="p1" class="wire" d="M170,138 H235"/>
  <path id="p2" class="wire" d="M385,138 C425,138 425,66 465,66"/>
  <path id="p3" class="wire" d="M385,138 H465"/>
  <path id="p4" class="wire" d="M385,138 C425,138 425,212 465,212"/>
  <path id="p5" class="wire" d="M615,138 H700"/>
  <path id="p6" class="wire" d="M615,212 C660,212 660,138 700,138"/>

  <!-- Nodos -->
  <g>
    <rect class="node" x="20" y="112" width="150" height="52" rx="10"/>
    <text class="t" x="95" y="134" font-size="14" font-weight="700" text-anchor="middle">Angular</text>
    <text class="sub" x="95" y="152" font-size="10" text-anchor="middle">TypeScript · Material</text>
  </g>
  <g>
    <rect class="node" x="235" y="112" width="150" height="52" rx="10"/>
    <text class="t" x="310" y="134" font-size="14" font-weight="700" text-anchor="middle">API REST</text>
    <text class="sub" x="310" y="152" font-size="10" text-anchor="middle">Express · Fastify · JWT</text>
  </g>
  <g>
    <rect class="node" x="465" y="40" width="150" height="52" rx="10"/>
    <text class="t" x="540" y="62" font-size="14" font-weight="700" text-anchor="middle">Redis</text>
    <text class="sub" x="540" y="80" font-size="10" text-anchor="middle">cache · search</text>
  </g>
  <g>
    <rect class="node" x="465" y="112" width="150" height="52" rx="10"/>
    <text class="t" x="540" y="134" font-size="14" font-weight="700" text-anchor="middle">SQL</text>
    <text class="sub" x="540" y="152" font-size="10" text-anchor="middle">PostgreSQL · MySQL</text>
  </g>
  <g>
    <rect class="node" x="465" y="186" width="150" height="52" rx="10"/>
    <text class="t" x="540" y="208" font-size="14" font-weight="700" text-anchor="middle">MongoDB</text>
    <text class="sub" x="540" y="226" font-size="10" text-anchor="middle">replica sets · sharding</text>
  </g>
  <g>
    <rect class="node" x="700" y="112" width="170" height="52" rx="10"/>
    <text class="t" x="785" y="134" font-size="14" font-weight="700" text-anchor="middle">Analytics</text>
    <text class="sub" x="785" y="152" font-size="10" text-anchor="middle">Airflow · Spark · Metabase</text>
  </g>

  <!-- Destello al llegar la petición a cada capa -->
  <rect class="pulse" x="235" y="112" width="150" height="52" rx="10" style="animation-delay:0.67s"/>
  <rect class="pulse" x="465" y="112" width="150" height="52" rx="10" style="animation-delay:1.82s"/>
  <rect class="pulse" x="700" y="112" width="170" height="52" rx="10" style="animation-delay:2.97s"/>

  <!-- Petición en vuelo: API (0–16%), capas de datos (20–40%), analítica (44–64%) del ciclo -->
  <g>
    <circle class="halo" r="9" opacity="0">
      <animateMotion dur="4.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0;0.16;1"><mpath xlink:href="#p1"/></animateMotion>
      <animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0;0.16" values="0;1;0"/>
    </circle>
    <circle class="dot" r="4" opacity="0">
      <animateMotion dur="4.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0;0.16;1"><mpath xlink:href="#p1"/></animateMotion>
      <animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0;0.16" values="0;1;0"/>
    </circle>
    <circle class="dot" r="3.5" opacity="0">
      <animateMotion dur="4.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2;0.4;1"><mpath xlink:href="#p2"/></animateMotion>
      <animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4" values="0;1;0"/>
    </circle>
    <circle class="dot" r="4" opacity="0">
      <animateMotion dur="4.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2;0.4;1"><mpath xlink:href="#p3"/></animateMotion>
      <animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4" values="0;1;0"/>
    </circle>
    <circle class="dot" r="3.5" opacity="0">
      <animateMotion dur="4.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2;0.4;1"><mpath xlink:href="#p4"/></animateMotion>
      <animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4" values="0;1;0"/>
    </circle>
    <circle class="dot" r="4" opacity="0">
      <animateMotion dur="4.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.44;0.64;1"><mpath xlink:href="#p5"/></animateMotion>
      <animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.44;0.64" values="0;1;0"/>
    </circle>
    <circle class="dot" r="3.5" opacity="0">
      <animateMotion dur="4.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.44;0.64;1"><mpath xlink:href="#p6"/></animateMotion>
      <animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.44;0.64" values="0;1;0"/>
    </circle>
  </g>

  <!-- Petición actual -->
  <text class="req r1" x="20" y="100" >POST /reservations</text>
  <text class="req r2" x="20" y="100" >GET  /meetings</text>
  <text class="req r3" x="20" y="100" >PUT  /agenda-items</text>

  <text class="sub" x="20" y="278" font-size="11">a request traveling through the stack I've worked with</text>
</svg>
