<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 178" width="430" height="178" role="img" aria-label="Smart Restaurant Reservations" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Smart Restaurant Reservations</title>
  <style>
    .t   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #24292f; }
    .sub { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
    .acc { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e0562f; }
    .card{ fill: rgba(108,140,255,0.08); stroke: #6c8cff; stroke-width: 1.5; }
    .chip{ fill: rgba(108,140,255,0.14); stroke: #6c8cff; stroke-opacity:.45; stroke-width: 1; }
    .rule{ stroke: #6c8cff; stroke-opacity: .35; stroke-width: 1; stroke-dasharray: 3 5; }
    .go  { animation: nudge 1.8s ease-in-out infinite; }
    .live{ animation: blink 1.6s ease-in-out infinite; }
    .sweep{ animation: sweep 5s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes sweep { 0% { transform: translateX(-60px); opacity: 0; } 15% { opacity: .9; } 55% { opacity: .9; } 70%,100% { transform: translateX(430px); opacity: 0; } }
    @media (prefers-color-scheme: dark) {
      .t   { fill: #e6edf3; } .sub { fill: #8b949e; } .acc { fill: #ff8a68; }
      .card{ fill: rgba(108,140,255,0.12); stroke: #8da6ff; }
      .chip{ fill: rgba(141,166,255,0.16); stroke: #8da6ff; }
    }
    @media (prefers-reduced-motion: reduce) { .go, .live, .sweep { animation: none; } .sweep { opacity: 0; } }
  </style>
  <clipPath id="cl"><rect x="1" y="1" width="428" height="176" rx="14"/></clipPath>
  <rect class="card" x="1" y="1" width="428" height="176" rx="14"/>
  <g clip-path="url(#cl)"><rect class="sweep" x="0" y="1" width="60" height="3" fill="#ff7a59"/></g>
  <text class="sub" x="20" y="27" font-size="10">project 01</text>
  <rect class="chip" x="326.9" y="12" width="83.1" height="20" rx="10"/>
  <text class="sub" x="334.9" y="26" font-size="10">OLTP + OLAP</text>
  <text class="t" x="20" y="54" font-size="15" font-weight="700">Smart Restaurant Reservations</text>
  <text class="sub" x="20" y="76" font-size="11">Reservations and orders with a transactional</text>
  <text class="sub" x="20" y="92" font-size="11">and an analytical layer on the same data.</text>
  <line class="rule" x1="20" y1="104" x2="410" y2="104"/>
  <text class="sub" x="20" y="120" font-size="9" letter-spacing="1.2">KEY DECISION</text>
  <text class="acc" x="20" y="136" font-size="11.5" font-weight="600">Swappable DB engine via DB_TYPE</text>
  <rect class="chip" x="20" y="146" width="58.7" height="20" rx="10"/>
  <text class="t" x="28" y="160" font-size="10">Node.js</text>
  <rect class="chip" x="84.7" y="146" width="77.0" height="20" rx="10"/>
  <text class="t" x="92.7" y="160" font-size="10">PostgreSQL</text>
  <rect class="chip" x="167.7" y="146" width="58.7" height="20" rx="10"/>
  <text class="t" x="175.7" y="160" font-size="10">MongoDB</text>
  <rect class="chip" x="232.39999999999998" y="146" width="46.5" height="20" rx="10"/>
  <text class="t" x="240.39999999999998" y="160" font-size="10">Redis</text>
  <rect class="chip" x="284.9" y="146" width="77.0" height="20" rx="10"/>
  <text class="t" x="292.9" y="160" font-size="10">Kubernetes</text>
  <text class="acc go" x="396" y="162" font-size="17" font-weight="700">→</text>
</svg>